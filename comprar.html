<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketShow - Finalizar Compra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-principal">
    <div class="topbar">
      <div class="logo">🎟️ TICKETSHOW</div>
      <div class="topbar-links">
        <a href="support.html">SOPORTE</a>
        <a href="mis_entradas.html" id="link-mis-entradas" hidden>MIS ENTRADAS</a>
        <a href="login.html" id="link-sesion">INGRESAR / REGISTRARSE</a>
        <a href="carrito.html">CARRITO <span id="cart-count" class="cart-badge"></span></a>
      </div>
    </div>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="listado_box.html">Listado de Eventos</a>
    <a href="producto.html">Ficha de Ticket</a>
  </nav>

  <main>
  <div class="contenido">
    <h2>Finalizar Compra</h2>

    <div id="resumen-checkout" class="resumen-carrito" style="margin:0 0 20px 0; max-width:100%; text-align:left;">
      <!-- Se completa dinámicamente con los ítems del carrito -->
    </div>

    <form id="form-compra" action="#" method="post">

      <label for="nombre">Nombre del cliente:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>

      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Siempre Viva 123" required>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11-2345-6789" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Ej: juan@correo.com" required>

      <label for="pago">Medio de pago:</label>
      <select id="pago" name="pago">
        <option value="tarjeta_credito">Tarjeta de crédito</option>
        <option value="tarjeta_debito">Tarjeta de débito</option>
        <option value="transferencia">Transferencia bancaria</option>
        <option value="efectivo">Efectivo (Pago Fácil / Rapipago)</option>
      </select>

      <input type="submit" value="Confirmar compra">

    </form>
  </div>
  </main>

  <footer>
    <p>TicketShow &copy; 2026 - Todos los derechos reservados</p>
  </footer>

  <script src="carrito.js"></script>
  <script src="app.js"></script>
  <script src="comprar.js"></script>

</body>
</html>
