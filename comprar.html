<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketShow - Comprar Entradas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎟️ TicketShow</h1>
    <p>Tu entrada a los mejores shows en vivo</p>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="listado_tabla.html">Listado (Tabla)</a>
    <a href="listado_box.html">Listado (Cajas)</a>
    <a href="producto.html">Ficha de Ticket</a>
    <a href="comprar.html">Comprar</a>
  </nav>

  <main>
  <div class="contenido">
    <h2>Formulario de Compra</h2>

    <form action="#" method="post">

      <label for="nombre">Nombre del cliente:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">

      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Siempre Viva 123">

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11-2345-6789">

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Ej: juan@correo.com">

      <label for="pago">Medio de pago:</label>
      <select id="pago" name="pago">
        <option value="tarjeta_credito">Tarjeta de crédito</option>
        <option value="tarjeta_debito">Tarjeta de débito</option>
        <option value="transferencia">Transferencia bancaria</option>
        <option value="efectivo">Efectivo (Pago Fácil / Rapipago)</option>
      </select>

      <label for="tickets">Ticket seleccionado:</label>
      <select id="tickets" name="tickets">
        <option value="duki" data-precio="45000">BTS World Tour ($45.000)</option>
        <option value="bandalos" data-precio="80000">Olivia Wald ($80.000)</option>
        <option value="beriso" data-precio="75000">Maroon 5 ($75.000)</option>
        <option value="nathy" data-precio="65000">CALAMARO ($65.000)</option>
      </select>

 

      <label for="cantidad">Cantidad de entradas:</label>
      <input type="number" id="cantidad" name="cantidad" min="1" value="1">

      <label for="cupon">Código de descuento (opcional):</label>
      <input type="text" id="cupon" name="cupon" placeholder="Ej: UCP10">
      <button type="button" onclick="validarCupon()">Aplicar cupón</button>

      <div id="mensaje"></div>

      <p>Subtotal a abonar: $<span id="subtotal">45.000</span></p>

      <input type="submit" value="Confirmar compra">

    </form>
  </div>
  </main>

  <footer>
    <p>TicketShow &copy; 2026 - Todos los derechos reservados</p>
  </footer>

  <script src="comprar.js"></script>

</body>
</html>
