<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TicketShow: entradas para shows y recitales en vivo.">
  <title>TicketShow - Cartelera</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="#/" translate="no"><span class="logo__icono" aria-hidden="true">🎟️</span>TicketShow</a>
      <nav class="menu" aria-label="Menú principal">
        <a href="#/" data-ruta="#/">Cartelera</a>
      </nav>
      <div class="site-header__cuenta" id="cuenta" aria-label="Cuenta"></div>
    </div>
  </header>

  <!-- Región viva: avisa a lectores de pantalla cada cambio de vista -->
  <p class="sr-only" id="anuncio" role="status" aria-live="polite"></p>

  <main id="vista" tabindex="-1"></main>

  <footer class="footer-grande">
    <p class="footer-copy">TicketShow &copy; 2026 - Proyecto académico (AE4 · TIFAS)</p>
  </footer>

  <noscript><p>TicketShow necesita JavaScript habilitado para funcionar.</p></noscript>
</body>
</html>
